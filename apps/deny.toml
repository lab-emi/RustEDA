# Third-party dependencies remain crates.io-only. The pinned first-party foundation is allowed.
# Changes to this file require written maintainer approval.

[graph]
all-features = true

[advisories]
# Vulnerabilities always fail. Unmaintained crates fail only for direct dependencies.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
]
# Weak-copyleft or data licenses are approved per crate, never globally.
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["ssh://git@github.com/lab-emi/RustEDA-Common.git"]
