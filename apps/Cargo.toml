[workspace]
resolver = "3"
members = ["crates/*/*", "xtask"]
default-members = ["crates/apps/rusteda-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false
authors = ["RustEDA contributors"]
repository = "https://github.com/lab-emi/RustEDA"

[workspace.dependencies]
rusteda-core = { git = "https://github.com/lab-emi/RustEDA-Common.git", rev = "ef598d153168a73899c73b33c3ce84ff42d809ea" }
rusteda-workspace = { git = "https://github.com/lab-emi/RustEDA-Common.git", rev = "ef598d153168a73899c73b33c3ce84ff42d809ea" }
# No member uses rusteda-compute; `./dev shared` requires every consumer of the foundation to pin
# all five shared crates at the recorded revision, so Cargo reports this one entry as unused.
rusteda-compute = { git = "https://github.com/lab-emi/RustEDA-Common.git", rev = "ef598d153168a73899c73b33c3ce84ff42d809ea" }
rusteda-formats = { git = "https://github.com/lab-emi/RustEDA-Common.git", rev = "ef598d153168a73899c73b33c3ce84ff42d809ea" }
rusteda-flow = { path = "crates/apps/rusteda-flow" }
rusteda-studio = { path = "crates/apps/rusteda-studio", default-features = false }
rusteda-cli-shared = { package = "rusteda-cli-common", git = "https://github.com/lab-emi/RustEDA-Common.git", rev = "ef598d153168a73899c73b33c3ce84ff42d809ea" }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "color", "suggestions"] }
clap_complete = { version = "=4.6.11", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
# float_roundtrip: the decimal text of a stored f64 parses back to the same value.
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
rayon = "=1.12.0"
# The workbench's user-interface framework (plan §6.1), used only by the `gui` feature of
# `rusteda-studio` (an apps crate, Rule 1.3). The released 0.2.2 is the last version on
# crates.io; the component library of the plan does not build against it in its current
# release (docs/adr/0001-gui-toolkit.md), so the workbench uses the framework alone.
gpui = "=0.2.2"
# Held at 0.2.189 for the user-interface framework: 0.2.190 removed `ENOATTR` on Linux, which the
# extended-attribute crate under the framework's HTTP client still reads (0.2.3). The studio's
# `gui` feature names it only to keep this version (docs/adr/0001-gui-toolkit.md).
libc = "=0.2.189"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
too_many_arguments = "allow"
module_inception = "allow"
# Style preferences of this code base.
collapsible_if = "allow"
type_complexity = "allow"
needless_range_loop = "allow"

[profile.release]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
