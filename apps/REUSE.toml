version = 1

[[annotations]]
path = [
    "Cargo.toml", "Cargo.lock", "**/Cargo.toml", "*.toml", ".config/**", ".cargo/**",
    ".github/**", ".editorconfig", ".gitattributes", ".gitignore",
    "**/README.md", "*.md", "NOTICE", "docs/**", "verification/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 RustEDA Studio contributors"
SPDX-License-Identifier = "Apache-2.0"

# The shared crates and their specifications, identical in the repositories of all RustEDA tools.
# Of the annotations that match a file, the last one applies.
[[annotations]]
path = [
    "crates/core/rusteda-core/**", "crates/core/rusteda-workspace/**",
    "crates/core/rusteda-compute/**", "crates/formats/rusteda-formats/**",
    "crates/apps/rusteda-cli/**", "docs/specs/core/**", "docs/specs/workspace/**",
    "docs/specs/compute/**", "docs/specs/verilog/**", "docs/specs/liberty/**", "docs/specs/sdc/**",
    "docs/specs/rusteda-cli/**", "verification/pdks.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 RustEDA contributors"
SPDX-License-Identifier = "Apache-2.0"
