# Standard-cell libraries of the PDK suites of the RustEDA tool repositories. This file is shared:
# it is identical in each repository that has it.
#
# `cargo xtask pdk fetch` downloads them into the library directory (`--dir`, else
# $RUSTEDA_PDK_DIR, else target/pdk; never a tracked path) and verifies every hash; each
# repository's `cargo xtask verify pdk` runs its own suite with them.
#
# Each [[library]] describes one library file, `<library>__<corner>.lib` in the library directory,
# pinned to a commit of the vendor repository. `sha256` and `size` are those of that file; every
# entry records both, so no file is trusted on first use. The file is either downloaded whole from
# `url`, or assembled from a corner header and per-cell fragments, both paths below `base_url`:
# the header without its last line `}` (and the blank lines after it), then for each fragment in
# the listed order a newline and the fragment, then a newline, `}` and a newline. The fragments
# are listed in version order of their file names (`sort -V`), so the assembly can be repeated
# without network from a clone of the vendor repository at the commit.

