[package]
name = "rustlane-gui-evaluation"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"

# Intentionally isolated from RustLane's production dependency graph.
[workspace]

[dependencies]
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui_extras = { version = "=0.37.0", default-features = false }
egui-wgpu = { version = "=0.37.0", default-features = false }
egui_tiles = { version = "=0.18.0", default-features = false }
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland"] }
rustlane = { path = "../.." }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
pollster = "=0.4.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[profile.release]
debug = false
