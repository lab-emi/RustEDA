[package]
name = "rustlane"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Daemonless ASIC implementation workflows with RustSys and RustSTA"
repository = "https://github.com/lab-emi/RustLane"
publish = false

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
fs2 = "=0.4.3"
libc = "=0.2.183"
memmap2 = "=0.9.11"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
